<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Wahj Al-DNA</title>
    <meta
      name="description"
      content="Sign in to your Wahj Al-DNA account and continue previous molecular biology reading and tools."
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="../styles.css?v=20260710-account-design" />
  </head>
  <body class="account-page">
    <div class="site-shell">
      <header class="site-header site-header-compact" id="top">
        <div class="brand-lockup">
          <img src="../assets/wahj-logo.png" alt="Wahj Al-DNA logo" class="brand-logo" />
          <div>
            <p class="eyebrow">Learning account</p>
            <p class="brand-title">Wahj Al-DNA</p>
          </div>
        </div>
        <a class="hub-link" href="../">All topics</a>
      </header>

      <main>
        <section class="section account-hero">
          <div class="account-copy">
            <span class="section-chip">Continue learning</span>
            <h1>Sign in</h1>
            <p class="hero-lead">
              Use your account to continue from the lecture or tool page you opened before.
            </p>
            <p class="account-status" data-firebase-setup-warning></p>
          </div>

          <div class="account-form-stack">
            <form class="account-form" id="account-login-form">
              <label class="field field-wide">
                <span>Email</span>
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label class="field field-wide">
                <span>Password</span>
                <input name="password" type="password" autocomplete="current-password" required />
              </label>
              <button class="primary-action field-wide" type="submit">Sign in</button>
              <p class="account-status field-wide" data-account-status></p>
            </form>

            <form class="account-form account-form-secondary" id="account-reset-form">
              <h2>Reset password</h2>
              <label class="field field-wide">
                <span>Email</span>
                <input name="reset_email" type="email" autocomplete="email" required />
              </label>
              <button class="secondary-action field-wide" type="submit">Send reset email</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="../config.js?v=20260710-account-design"></script>
    <script src="../script.js?v=20260710-account-design"></script>
  </body>
</html>

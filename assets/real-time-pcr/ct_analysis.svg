<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Ct interpretation in real-time PCR</title>
  <desc id="desc">Teaching diagram showing baseline, threshold, Ct, amplification phases, and the difference between linear and log amplification views in real-time PCR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef5fb"/>
    </linearGradient>
    <style>
      .panel{fill:url(#bg);stroke:#c9d8e6;stroke-width:2}
      .axis{stroke:#23415e;stroke-width:2.6}
      .grid{stroke:#dfe9f2;stroke-width:1}
      .curve{fill:none;stroke:#d64033;stroke-width:5}
      .curve-soft{fill:none;stroke:#cc5360;stroke-width:4}
      .threshold{stroke:#3c8b69;stroke-width:3.5}
      .baseline{fill:#d9ebfb;opacity:.65;stroke:#6aa8d6;stroke-dasharray:10 8;stroke-width:2}
      .marker{stroke:#0f70c1;stroke-width:3;stroke-dasharray:8 8}
      .phase{fill:#e9f5ee;stroke:#91c2a6}
      .phase2{fill:#f8efe0;stroke:#d6b671}
      .phase3{fill:#f7e1df;stroke:#d08b84}
      .h1{font:700 30px 'Avenir Next','Segoe UI',sans-serif;fill:#163554}
      .h2{font:700 22px 'Avenir Next','Segoe UI',sans-serif;fill:#163554}
      .txt{font:18px 'Avenir Next','Segoe UI',sans-serif;fill:#24445f}
      .small{font:16px 'Avenir Next','Segoe UI',sans-serif;fill:#47627a}
      .axislabel{font:700 18px 'Avenir Next','Segoe UI',sans-serif;fill:#1c3954}
    </style>
  </defs>

  <rect width="1400" height="860" fill="#f8fbfd"/>
  <text x="60" y="58" class="h1">How Ct is assigned from an amplification curve</text>
  <text x="60" y="90" class="txt">Left panel: DeltaRn versus cycle number. Right panel: log-scale view of the same amplification logic.</text>

  <rect x="50" y="120" width="620" height="650" rx="28" class="panel"/>
  <rect x="730" y="120" width="620" height="650" rx="28" class="panel"/>

  <text x="80" y="166" class="h2">A. Linear display (DeltaRn vs cycle number)</text>
  <text x="760" y="166" class="h2">B. Log amplification view</text>

  <!-- Left panel grid -->
  <g transform="translate(110 220)">
    <line x1="0" y1="470" x2="470" y2="470" class="axis"/>
    <line x1="0" y1="470" x2="0" y2="10" class="axis"/>
    <g class="grid">
      <line x1="47" y1="10" x2="47" y2="470"/>
      <line x1="94" y1="10" x2="94" y2="470"/>
      <line x1="141" y1="10" x2="141" y2="470"/>
      <line x1="188" y1="10" x2="188" y2="470"/>
      <line x1="235" y1="10" x2="235" y2="470"/>
      <line x1="282" y1="10" x2="282" y2="470"/>
      <line x1="329" y1="10" x2="329" y2="470"/>
      <line x1="376" y1="10" x2="376" y2="470"/>
      <line x1="423" y1="10" x2="423" y2="470"/>
      <line x1="0" y1="410" x2="470" y2="410"/>
      <line x1="0" y1="350" x2="470" y2="350"/>
      <line x1="0" y1="290" x2="470" y2="290"/>
      <line x1="0" y1="230" x2="470" y2="230"/>
      <line x1="0" y1="170" x2="470" y2="170"/>
      <line x1="0" y1="110" x2="470" y2="110"/>
      <line x1="0" y1="50" x2="470" y2="50"/>
    </g>

    <rect x="32" y="378" width="168" height="76" rx="18" class="baseline"/>
    <text x="56" y="406" class="txt">Baseline region</text>
    <text x="56" y="432" class="small">Noise dominates here</text>

    <line x1="0" y1="230" x2="470" y2="230" class="threshold"/>
    <text x="316" y="218" class="txt">Threshold</text>

    <path class="curve" d="M20,420 C140,420 180,421 220,418 C255,416 275,405 298,377 C320,350 330,310 346,258 C364,196 386,132 414,94 C432,69 448,50 462,34"/>

    <line x1="312" y1="470" x2="312" y2="230" class="marker"/>
    <text x="286" y="500" class="txt">Ct</text>

    <text x="-12" y="22" class="axislabel">DeltaRn</text>
    <text x="176" y="520" class="axislabel">Cycle number</text>

    <g class="small">
      <text x="-10" y="474">0</text>
      <text x="36" y="494">5</text>
      <text x="83" y="494">10</text>
      <text x="128" y="494">15</text>
      <text x="175" y="494">20</text>
      <text x="222" y="494">25</text>
      <text x="269" y="494">30</text>
      <text x="316" y="494">35</text>
      <text x="363" y="494">40</text>
    </g>
  </g>

  <!-- Right panel grid -->
  <g transform="translate(790 220)">
    <line x1="0" y1="470" x2="470" y2="470" class="axis"/>
    <line x1="0" y1="470" x2="0" y2="10" class="axis"/>
    <g class="grid">
      <line x1="47" y1="10" x2="47" y2="470"/>
      <line x1="94" y1="10" x2="94" y2="470"/>
      <line x1="141" y1="10" x2="141" y2="470"/>
      <line x1="188" y1="10" x2="188" y2="470"/>
      <line x1="235" y1="10" x2="235" y2="470"/>
      <line x1="282" y1="10" x2="282" y2="470"/>
      <line x1="329" y1="10" x2="329" y2="470"/>
      <line x1="376" y1="10" x2="376" y2="470"/>
      <line x1="423" y1="10" x2="423" y2="470"/>
      <line x1="0" y1="410" x2="470" y2="410"/>
      <line x1="0" y1="350" x2="470" y2="350"/>
      <line x1="0" y1="290" x2="470" y2="290"/>
      <line x1="0" y1="230" x2="470" y2="230"/>
      <line x1="0" y1="170" x2="470" y2="170"/>
      <line x1="0" y1="110" x2="470" y2="110"/>
      <line x1="0" y1="50" x2="470" y2="50"/>
    </g>

    <rect x="18" y="370" width="146" height="72" rx="16" class="phase"/>
    <rect x="174" y="230" width="140" height="72" rx="16" class="phase2"/>
    <rect x="324" y="86" width="122" height="72" rx="16" class="phase3"/>

    <text x="40" y="398" class="txt">Geometric</text>
    <text x="40" y="423" class="small">Most useful for quantitation</text>
    <text x="196" y="258" class="txt">Later linear phase</text>
    <text x="346" y="114" class="txt">Plateau</text>

    <line x1="0" y1="290" x2="470" y2="290" class="threshold"/>
    <text x="286" y="278" class="txt">Threshold set here</text>

    <path class="curve-soft" d="M20,438 C108,430 158,404 208,345 C248,298 288,242 330,180 C364,129 404,93 454,65"/>
    <line x1="236" y1="470" x2="236" y2="290" class="marker"/>
    <text x="220" y="500" class="txt">Ct</text>

    <text x="-6" y="22" class="axislabel">log(DeltaRn)</text>
    <text x="176" y="520" class="axislabel">Cycle number</text>

    <g class="small">
      <text x="-18" y="474">low</text>
      <text x="36" y="494">5</text>
      <text x="83" y="494">10</text>
      <text x="128" y="494">15</text>
      <text x="175" y="494">20</text>
      <text x="222" y="494">25</text>
      <text x="269" y="494">30</text>
      <text x="316" y="494">35</text>
      <text x="363" y="494">40</text>
    </g>
  </g>

  <g transform="translate(70 784)">
    <rect width="1260" height="52" rx="18" fill="#ffffff" stroke="#d6e3ef"/>
    <text x="24" y="33" class="txt">Interpretation: lower starting target usually produces lower Ct, but chemistry, thresholding, and efficiency can also shift Ct independently of biology.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">qPCR thermal cycling</title>
  <desc id="desc">Temperature stages for denaturation, annealing, extension, fluorescence acquisition, and optional melt curve.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d4059"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .axis{stroke:#2d4059;stroke-width:4}
      .curve{stroke:#e63946;stroke-width:7;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .step{fill:#ffffff;stroke:#2d4059;stroke-width:2.5;rx:14}
      .stepA{fill:#fff3df;stroke:#c35a00;stroke-width:2.5;rx:14}
      .stepB{fill:#e9f5f2;stroke:#007f73;stroke-width:2.5;rx:14}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;font-size:28px;font-weight:700}
      .sub{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:18px}
      .tiny{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:15px}
      .grid{stroke:#d7dee8;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="600" y="54" text-anchor="middle" class="text" font-size="34">Typical qPCR Thermal Program</text>
  <text x="600" y="84" text-anchor="middle" class="sub">Exact temperatures and times must follow the validated kit and assay protocol.</text>

  <line x1="110" y1="510" x2="1090" y2="510" class="axis" marker-end="url(#arrow)"/>
  <line x1="110" y1="510" x2="110" y2="130" class="axis" marker-end="url(#arrow)"/>
  <text x="1085" y="545" text-anchor="end" class="sub">Time / cycles</text>
  <text x="55" y="150" transform="rotate(-90 55 150)" class="sub">Temperature</text>

  <line x1="110" y1="180" x2="1090" y2="180" class="grid"/>
  <line x1="110" y1="300" x2="1090" y2="300" class="grid"/>
  <line x1="110" y1="420" x2="1090" y2="420" class="grid"/>
  <text x="75" y="186" class="tiny">95 degC</text>
  <text x="75" y="306" class="tiny">60 degC</text>
  <text x="75" y="426" class="tiny">50 degC</text>

  <path class="curve" d="M145 500 L175 180 L235 180 L270 300 L370 300 L405 180 L465 180 L500 300 L600 300 L635 180 L695 180 L730 300 L830 300 L870 180 L930 180 L980 300 L1045 420"/>
  <text x="920" y="128" class="tiny">Repeat 35-45 cycles</text>

  <rect x="125" y="555" width="170" height="65" class="stepA"/>
  <text x="210" y="582" text-anchor="middle" class="sub" font-weight="700">Activation</text>
  <text x="210" y="607" text-anchor="middle" class="tiny">Hot-start enzyme</text>

  <rect x="350" y="555" width="190" height="65" class="step"/>
  <text x="445" y="582" text-anchor="middle" class="sub" font-weight="700">Denature</text>
  <text x="445" y="607" text-anchor="middle" class="tiny">Strands separate</text>

  <rect x="575" y="555" width="210" height="65" class="stepB"/>
  <text x="680" y="582" text-anchor="middle" class="sub" font-weight="700">Anneal / Extend</text>
  <text x="680" y="607" text-anchor="middle" class="tiny">Primers bind; product grows</text>

  <rect x="820" y="555" width="240" height="65" class="step"/>
  <text x="940" y="582" text-anchor="middle" class="sub" font-weight="700">Acquire Signal</text>
  <text x="940" y="607" text-anchor="middle" class="tiny">Fluorescence is measured</text>

  <text x="1045" y="447" text-anchor="middle" class="tiny">Melt curve</text>
  <text x="1045" y="469" text-anchor="middle" class="tiny">dye assays only</text>
</svg>

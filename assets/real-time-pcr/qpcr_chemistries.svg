<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Common qPCR fluorescence chemistries</title>
  <desc id="desc">Comparison of dye-based qPCR and hydrolysis probe qPCR.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#2d4059;stroke-width:2.5;rx:18}
      .panel2{fill:#eef8ff;stroke:#1f77b4;stroke-width:2.5;rx:18}
      .heading{font-family:Arial,Helvetica,sans-serif;fill:#17202a;font-size:32px;font-weight:700}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;font-size:24px;font-weight:700}
      .sub{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:18px}
      .dna{stroke:#2d4059;stroke-width:7;fill:none;stroke-linecap:round}
      .primer{stroke:#c35a00;stroke-width:7;fill:none;stroke-linecap:round}
      .dye{fill:#00a676;stroke:#006b54;stroke-width:2}
      .probe{stroke:#8a2be2;stroke-width:8;stroke-linecap:round}
      .quencher{fill:#333333}
      .reporter{fill:#ffbf00;stroke:#9c6b00;stroke-width:2}
      .note{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:16px}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="600" y="56" text-anchor="middle" class="heading">How Real-Time PCR Makes a Signal</text>

  <rect x="55" y="105" width="520" height="480" class="panel"/>
  <text x="315" y="150" text-anchor="middle" class="text">Dye-Based Assay</text>
  <text x="315" y="178" text-anchor="middle" class="sub">Example: SYBR Green or EvaGreen</text>
  <path class="dna" d="M125 265 C185 215, 245 315, 305 265 C365 215, 425 315, 485 265"/>
  <path class="dna" d="M125 315 C185 365, 245 265, 305 315 C365 365, 425 265, 485 315"/>
  <circle cx="185" cy="284" r="16" class="dye"/>
  <circle cx="275" cy="292" r="16" class="dye"/>
  <circle cx="365" cy="284" r="16" class="dye"/>
  <circle cx="445" cy="292" r="16" class="dye"/>
  <text x="315" y="395" text-anchor="middle" class="sub">Fluorescent dye binds double-stranded DNA.</text>
  <text x="315" y="425" text-anchor="middle" class="sub">More PCR product gives more fluorescence.</text>
  <text x="315" y="475" text-anchor="middle" class="note">Strength: simple and low cost</text>
  <text x="315" y="505" text-anchor="middle" class="note">Main risk: any double-stranded product can fluoresce</text>
  <text x="315" y="535" text-anchor="middle" class="note">Always inspect melt curve or product specificity</text>

  <rect x="625" y="105" width="520" height="480" class="panel2"/>
  <text x="885" y="150" text-anchor="middle" class="text">Hydrolysis Probe Assay</text>
  <text x="885" y="178" text-anchor="middle" class="sub">Example: TaqMan-style probe</text>
  <path class="dna" d="M695 292 C755 242, 815 342, 875 292 C935 242, 995 342, 1055 292"/>
  <path class="primer" d="M705 342 H805"/>
  <path class="probe" d="M845 342 H985"/>
  <circle cx="835" cy="342" r="18" class="reporter"/>
  <rect x="982" y="324" width="36" height="36" rx="6" class="quencher"/>
  <path d="M912 333 L925 351 M925 333 L912 351" stroke="#e63946" stroke-width="5" stroke-linecap="round"/>
  <text x="885" y="395" text-anchor="middle" class="sub">A target-specific probe binds between primers.</text>
  <text x="885" y="425" text-anchor="middle" class="sub">Polymerase cleavage separates reporter from quencher.</text>
  <text x="885" y="475" text-anchor="middle" class="note">Strength: higher specificity and multiplexing</text>
  <text x="885" y="505" text-anchor="middle" class="note">Main risk: probe design or sequence mismatch failure</text>
  <text x="885" y="535" text-anchor="middle" class="note">Use correct reporter channels and quenchers</text>

  <circle cx="87" cy="618" r="10" class="dye"/>
  <text x="107" y="624" class="note">Intercalating dye</text>
  <circle cx="262" cy="618" r="10" class="reporter"/>
  <text x="282" y="624" class="note">Reporter</text>
  <rect x="405" y="608" width="20" height="20" rx="4" class="quencher"/>
  <text x="435" y="624" class="note">Quencher</text>
</svg>

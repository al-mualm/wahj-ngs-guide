<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">TaqMan probe cleavage during real-time PCR</title>
  <desc id="desc">Teaching diagram showing annealing, polymerase extension, probe cleavage, and reporter release in a TaqMan real-time PCR assay.</desc>
  <defs>
    <style>
      .panel{fill:#ffffff;stroke:#cbd9e6;stroke-width:2}
      .dna{stroke:#1f3e5a;stroke-width:4}
      .primer{stroke:#0f70c1;stroke-width:7;stroke-linecap:round}
      .probe{stroke:#7346aa;stroke-width:7;stroke-linecap:round}
      .poly{fill:#f3a33b;stroke:#b86d18;stroke-width:2}
      .cut{stroke:#d64033;stroke-width:4;stroke-dasharray:8 8}
      .signal{fill:#fff1f1;stroke:#e77e73;stroke-width:2}
      .label{font:700 24px 'Avenir Next','Segoe UI',sans-serif;fill:#163554}
      .text{font:18px 'Avenir Next','Segoe UI',sans-serif;fill:#24445f}
      .small{font:16px 'Avenir Next','Segoe UI',sans-serif;fill:#47627a}
      .reporter{fill:#d64033}
      .quencher{fill:#20374f}
      .mgb{fill:#d6b671}
    </style>
    <g id="doubleStrand">
      <line x1="0" y1="0" x2="500" y2="0" class="dna"/>
      <line x1="0" y1="52" x2="500" y2="52" class="dna"/>
    </g>
    <g id="polymerase">
      <path d="M0,0 L48,14 L48,42 L0,56 Z" class="poly"/>
    </g>
  </defs>

  <rect width="1400" height="820" fill="#f8fbfd"/>
  <text x="60" y="56" class="label">TaqMan probe mechanism during amplification</text>
  <text x="60" y="88" class="text">Reporter fluorescence increases only when a correctly bound probe is cleaved during polymerase extension.</text>

  <rect x="50" y="120" width="1300" height="150" rx="26" class="panel"/>
  <rect x="50" y="295" width="1300" height="150" rx="26" class="panel"/>
  <rect x="50" y="470" width="1300" height="150" rx="26" class="panel"/>
  <rect x="50" y="645" width="1300" height="135" rx="26" class="panel"/>

  <!-- Step 1 -->
  <text x="82" y="160" class="label">1. Annealing: primers and probe bind the target</text>
  <text x="82" y="190" class="small">The reporter is still quenched because the probe remains intact.</text>
  <g transform="translate(120 208)">
    <use href="#doubleStrand"/>
    <line x1="64" y1="52" x2="136" y2="52" class="primer"/>
    <line x1="364" y1="0" x2="436" y2="0" class="primer"/>
    <line x1="184" y1="26" x2="318" y2="26" class="probe"/>
    <circle cx="182" cy="26" r="17" class="reporter"/>
    <circle cx="320" cy="26" r="17" class="quencher"/>
    <circle cx="346" cy="26" r="14" class="mgb"/>
    <text x="176" y="-16" class="text">R</text>
    <text x="314" y="-16" class="text">Q</text>
    <text x="340" y="-16" class="text">MGB</text>
  </g>

  <!-- Step 2 -->
  <text x="82" y="335" class="label">2. Extension begins: polymerase advances from the primer</text>
  <text x="82" y="365" class="small">The probe is still intact, so reporter and quencher remain close together.</text>
  <g transform="translate(120 383)">
    <use href="#doubleStrand"/>
    <line x1="64" y1="52" x2="136" y2="52" class="primer"/>
    <line x1="364" y1="0" x2="436" y2="0" class="primer"/>
    <line x1="184" y1="26" x2="318" y2="26" class="probe"/>
    <circle cx="182" cy="26" r="17" class="reporter"/>
    <circle cx="320" cy="26" r="17" class="quencher"/>
    <circle cx="346" cy="26" r="14" class="mgb"/>
    <g transform="translate(118 24)">
      <use href="#polymerase"/>
    </g>
  </g>

  <!-- Step 3 -->
  <text x="82" y="510" class="label">3. Probe cleavage: 5' nuclease activity separates reporter from quencher</text>
  <text x="82" y="540" class="small">This is the key event that converts correct target amplification into measurable fluorescence.</text>
  <g transform="translate(120 558)">
    <use href="#doubleStrand"/>
    <line x1="64" y1="52" x2="136" y2="52" class="primer"/>
    <line x1="364" y1="0" x2="436" y2="0" class="primer"/>
    <line x1="184" y1="26" x2="258" y2="26" class="probe"/>
    <line x1="262" y1="26" x2="318" y2="26" class="probe" stroke-dasharray="10 8"/>
    <circle cx="182" cy="26" r="17" class="reporter"/>
    <circle cx="320" cy="26" r="17" class="quencher"/>
    <circle cx="346" cy="26" r="14" class="mgb"/>
    <line x1="264" y1="6" x2="264" y2="46" class="cut"/>
    <g transform="translate(214 24)">
      <use href="#polymerase"/>
    </g>
  </g>

  <!-- Step 4 -->
  <text x="82" y="684" class="label">4. Signal release: reporter fluorescence accumulates over cycles</text>
  <text x="82" y="714" class="small">More correct amplicons produce more probe cleavage and therefore more signal.</text>
  <g transform="translate(120 733)">
    <use href="#doubleStrand"/>
    <line x1="64" y1="52" x2="136" y2="52" class="primer"/>
    <line x1="364" y1="0" x2="436" y2="0" class="primer"/>
    <g transform="translate(305 -2)">
      <circle cx="0" cy="0" r="26" class="signal"/>
      <circle cx="0" cy="0" r="13" class="reporter"/>
      <text x="-9" y="6" class="small">R</text>
    </g>
    <circle cx="320" cy="26" r="17" class="quencher"/>
    <circle cx="346" cy="26" r="14" class="mgb"/>
    <g transform="translate(260 24)">
      <use href="#polymerase"/>
    </g>
  </g>
</svg>

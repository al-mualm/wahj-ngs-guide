<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Real-time PCR workflow</title>
  <desc id="desc">Workflow from experimental question through sample, nucleic acid extraction, optional reverse transcription, reaction setup, qPCR run, quality control, and interpretation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d4059"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#ffffff;stroke:#2d4059;stroke-width:2.5;rx:14}
      .box2{fill:#e9f5f2;stroke:#007f73;stroke-width:2.5;rx:14}
      .box3{fill:#fff3df;stroke:#c35a00;stroke-width:2.5;rx:14}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;font-size:26px;font-weight:700}
      .sub{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:18px}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#34495e;font-size:16px}
      .arrow{stroke:#2d4059;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#2d4059;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="600" y="54" text-anchor="middle" class="text" font-size="34">Real-Time PCR Workflow</text>
  <text x="600" y="84" text-anchor="middle" class="sub">The result is only as good as the sample, controls, assay design, and analysis choices.</text>

  <rect x="40" y="135" width="190" height="130" class="box"/>
  <path class="icon" d="M92 188 C92 157, 148 157, 148 188 C148 220, 92 220, 92 188 Z M148 188 L182 222"/>
  <text x="135" y="290" text-anchor="middle" class="text">Question</text>
  <text x="135" y="318" text-anchor="middle" class="sub">Target and purpose</text>

  <rect x="270" y="135" width="190" height="130" class="box"/>
  <path class="icon" d="M365 164 L365 230 M335 230 L395 230 M345 180 L385 180 M350 205 L380 205"/>
  <text x="365" y="290" text-anchor="middle" class="text">Sample</text>
  <text x="365" y="318" text-anchor="middle" class="sub">Collect and store well</text>

  <rect x="500" y="135" width="190" height="130" class="box"/>
  <path class="icon" d="M548 217 C590 155, 600 235, 642 173 M548 173 C590 235, 600 155, 642 217"/>
  <text x="595" y="290" text-anchor="middle" class="text">Extract</text>
  <text x="595" y="318" text-anchor="middle" class="sub">DNA or RNA QC</text>

  <rect x="730" y="135" width="190" height="130" class="box3"/>
  <path class="icon" d="M788 182 L862 182 M788 212 L862 212 M802 166 L788 182 L802 198 M848 196 L862 212 L848 228"/>
  <text x="825" y="290" text-anchor="middle" class="text">RT Step</text>
  <text x="825" y="318" text-anchor="middle" class="sub">RNA only: cDNA</text>

  <rect x="960" y="135" width="190" height="130" class="box2"/>
  <path class="icon" d="M1012 172 H1098 V225 H1012 Z M1029 172 V225 M1046 172 V225 M1063 172 V225 M1080 172 V225 M1012 189 H1098 M1012 207 H1098"/>
  <text x="1055" y="290" text-anchor="middle" class="text">Set Up</text>
  <text x="1055" y="318" text-anchor="middle" class="sub">Master mix and plate</text>

  <rect x="270" y="420" width="190" height="130" class="box2"/>
  <path class="icon" d="M326 472 H404 V522 H326 Z M345 472 V455 H385 V472 M342 493 H388 M342 511 H378"/>
  <text x="365" y="574" text-anchor="middle" class="text">Run qPCR</text>
  <text x="365" y="602" text-anchor="middle" class="sub">Cycles plus fluorescence</text>

  <rect x="500" y="420" width="190" height="130" class="box"/>
  <path class="icon" d="M545 514 L575 484 L598 505 L650 452 M545 514 H653"/>
  <text x="595" y="574" text-anchor="middle" class="text">QC</text>
  <text x="595" y="602" text-anchor="middle" class="sub">Controls, curves, replicates</text>

  <rect x="730" y="420" width="190" height="130" class="box"/>
  <path class="icon" d="M790 520 V456 H858 V520 M806 500 H842 M806 480 H842 M806 460 H842"/>
  <text x="825" y="574" text-anchor="middle" class="text">Interpret</text>
  <text x="825" y="602" text-anchor="middle" class="sub">Quantity or presence</text>

  <path class="arrow" d="M230 200 H270"/>
  <path class="arrow" d="M460 200 H500"/>
  <path class="arrow" d="M690 200 H730"/>
  <path class="arrow" d="M920 200 H960"/>
  <path class="arrow" d="M1055 265 C1055 360, 365 330, 365 420"/>
  <path class="arrow" d="M460 485 H500"/>
  <path class="arrow" d="M690 485 H730"/>

  <text x="1055" y="365" text-anchor="middle" class="small">Controls travel with the samples</text>
</svg>
